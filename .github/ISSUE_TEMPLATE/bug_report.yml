name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issue?** Don't file it here. Use [private reporting](../security/advisories/new)."
  - type: input
    id: version
    attributes: { label: Telltale Kube version, placeholder: "Settings → About" }
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux, Android, iPhone, iPad]
    validations: { required: true }
  - type: input
    id: k8s
    attributes: { label: Kubernetes version / distribution, placeholder: "e.g. 1.34 on EKS" }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Please redact cluster names, tokens and hostnames.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
